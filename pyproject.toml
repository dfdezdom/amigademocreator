[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amiga-demo-creator"
version = "0.1.0"
description = "Generate Amiga-style demo videos synchronized to music"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "moviepy>=1.0.3",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
fast = ["opencv-python-headless"]
live = ["pygame>=2.5.0"]

[project.scripts]
amiga_demo = "amiga_demo.cli:main"

[tool.setuptools.packages.find]
include = ["amiga_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
